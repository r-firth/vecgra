[workspace]
members = [
    "crates/vecgra",
    "crates/vecgra-cli",
    "crates/vecgra-embedding",
    "crates/vecgra-studio-core",
    "crates/vecgra-studio-ui",
    "crates/vecgra-studio",
]
default-members = [
    "crates/vecgra",
    "crates/vecgra-cli",
]
exclude = [
    "fuzz",
    "third-party/block",
    "third-party/noop-ztracing",
    "third-party/noop-ztracing-macro",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/r-firth/vecgra"
homepage = "https://github.com/r-firth/vecgra"
authors = ["Ryan Firth"]
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# Bezel uses a small GPUI fork for its GPU backdrop material. Pin every GPUI
# consumer to that exact revision so Studio keeps one compatible type universe.
gpui = { version = "=0.2.2", git = "https://github.com/crabtalk/zed", rev = "e0b415b4bcffe4a2f05221544a788d482f5f6f50" }
gpui_platform = { version = "=0.1.0", git = "https://github.com/crabtalk/zed", rev = "e0b415b4bcffe4a2f05221544a788d482f5f6f50", default-features = false }
gpui-component = { version = "=0.5.2", git = "https://github.com/longbridge/gpui-component", rev = "222cf9644fbfd9bdff970a0308f9ce216b2c0818" }
gpui-component-assets = { version = "=0.5.1", git = "https://github.com/longbridge/gpui-component", rev = "222cf9644fbfd9bdff970a0308f9ce216b2c0818" }
bezel-theme = { version = "=0.0.2", package = "theme", git = "https://github.com/crabtalk/bezel", rev = "49ee7b1d422d761551b3f6951d74cdfb87314241" }
bezel-ui = { version = "=0.0.2", package = "ui", git = "https://github.com/crabtalk/bezel", rev = "49ee7b1d422d761551b3f6951d74cdfb87314241" }

# gpui-component declares official Zed's Git source. Redirect its framework
# crates to Bezel's pinned fork instead of compiling a second GPUI.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/crabtalk/zed", rev = "e0b415b4bcffe4a2f05221544a788d482f5f6f50", version = "=0.2.2" }
gpui_platform = { version = "=0.1.0", git = "https://github.com/crabtalk/zed", rev = "e0b415b4bcffe4a2f05221544a788d482f5f6f50" }

# GPUI uses Zed's GPL tracing facade even when tracing is compiled as a no-op.
# Vecgra does not enable ZTRACING, so replace that disabled surface with a small
# Apache-2.0 compatibility implementation rather than pulling GPL code into the
# distributed Studio binary.
[patch."https://github.com/crabtalk/zed"]
ztracing = { version = "=0.1.0", path = "third-party/noop-ztracing" }
ztracing_macro = { version = "=0.1.0", path = "third-party/noop-ztracing-macro" }

# GPUI's macOS stack still uses block 0.1.6. The crates.io release declares an
# extern static as an uninhabited type, which future Rust versions will reject.
# This source-compatible MIT patch changes only that FFI declaration.
[patch.crates-io]
block = { version = "=0.1.6", path = "third-party/block" }

# GPUI pulls in the macOS graphics stack. Full debug symbols make a clean
# desktop build several gigabytes larger without improving normal iteration.
[profile.dev]
debug = 0
incremental = false

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.bench]
codegen-units = 1
lto = "thin"
