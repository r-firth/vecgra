[package]
name = "vectorgraph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vg"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
gemm = { version = "0.19.0", default-features = false, features = ["std", "rayon"] }
regex = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tree-sitter = "0.26.12"
tree-sitter-rust = "0.24.2"
ureq = { version = "3.4.0", features = ["json"] }
vectorgraph = { path = "../vectorgraph" }
vectorgraph-embedding = { path = "../vectorgraph-embedding" }

[lints]
workspace = true
