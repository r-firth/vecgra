[package]
name = "vectorgraph-studio"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
visual-test = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]

[[bin]]
name = "vg-studio"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
vectorgraph-studio-ui = { path = "../vectorgraph-studio-ui" }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform.workspace = true

[lints]
workspace = true
