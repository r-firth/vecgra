name: Feature request
description: Propose a focused database, query, importer, or Studio improvement
title: "proposal: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real workload is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe the smallest useful surface and relevant alternatives.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and tradeoffs
      description: Include data shape, scale, compatibility, memory, performance, or quality constraints.
