name: Bug report
description: Report reproducible incorrect behavior or a regression
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest graph or commands that reproduce the problem. Do not attach credentials or private data.
      render: shell
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Vecgra revision
      placeholder: Git commit or release
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: OS, architecture, and Rust version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Add logs, query plans, integrity output, or backtraces where relevant.
      render: text
